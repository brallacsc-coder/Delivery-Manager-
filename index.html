<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التاجر المتنقل | Mobile Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', } }, fontFamily: { sans: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .toast-enter { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; max-height: 200px; overflow-y: auto; z-index: 60; margin-top: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .dark .autocomplete-list { background: #1e293b; border-color: #334155; }
        .autocomplete-list div { padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .autocomplete-list div:hover { background: #f0fdf4; }
        .dark .autocomplete-list div:hover { background: #334155; }
        @media print { body * { visibility: hidden; } #receiptPrint, #receiptPrint * { visibility: visible; } #receiptPrint { position: absolute; left: 0; top: 0; width: 100%; } }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 bg-slate-100 dark:bg-slate-950 antialiased min-h-screen flex flex-col md:flex-row pb-16 md:pb-0" x-data="merchantApp()" x-init="initApp()">
    
    <aside class="w-full md:w-64 bg-slate-900 dark:bg-black text-slate-300 flex-shrink-0 z-20 shadow-xl">
        <div class="p-4 flex items-center justify-between border-b border-slate-800">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-lg shadow-brand-500/30"><i class="fa-solid fa-van-shuttle text-xl"></i></div>
                <div><h1 class="font-black text-lg text-white leading-tight" x-text="lang==='en'?'Mobile Merchant':'التاجر المتنقل'"></h1><span class="text-xs text-brand-400 font-medium" x-text="lang==='en'?'Sales & Trips':'نظام المبيعات والجولات'"></span></div>
            </div>
        </div>
        <nav class="hidden md:block p-3 space-y-1">
            <template x-for="item in navItems" :key="item.id">
                <button @click="currentTab = item.id" :class="currentTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'" class="w-full flex items-center px-4 py-3 rounded-xl transition font-bold justify-between">
                    <div class="flex items-center"><i class="fa-solid w-6 text-lg" :class="item.icon"></i><span class="mr-3" x-text="$t_title(item.id)"></span></div>
                </button>
            </template>
            <div class="pt-3 mt-3 border-t border-slate-800">
                <button @click="toggleDark()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold"><i class="fa-solid w-6 text-lg" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i><span class="mr-3" x-text="lang === 'en' ? (darkMode ? 'Light Mode' : 'Dark Mode') : (darkMode ? 'الوضع النهاري' : 'الوضع الليلي')"></span></button>
                <button @click="openSettings()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold"><i class="fa-solid fa-gear w-6 text-lg"></i><span class="mr-3" x-text="lang === 'en' ? 'Settings' : 'الإعدادات'"></span></button>
            </div>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 min-h-screen overflow-x-hidden">
        <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10 px-3 py-2.5 sm:px-6 sm:py-3 flex items-center justify-between shadow-sm gap-2">
            <h2 class="text-base sm:text-xl font-black flex items-center gap-2 truncate"><span x-text="$t_title(currentTab)"></span></h2>
            <div class="flex items-center space-x-1.5 sm:space-x-2 space-x-reverse flex-shrink-0">
                <button @click="cycleCurrency()" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-money-bill-wave text-brand-600"></i> <span x-text="currency"></span></button>
                <button @click="toggleLanguage()" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold"><span x-text="lang === 'ar' ? 'EN' : 'AR'"></span></button>
                <button @click="openModal('sale')" class="bg-brand-600 hover:bg-brand-700 text-white px-2.5 sm:px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-plus"></i><span x-text="lang === 'en' ? 'New Invoice' : 'فاتورة'"></span></button>
            </div>
        </header>
        <main class="flex-1 p-3 sm:p-6 space-y-5">
                        <div x-show="currentTab === 'dashboard'" class="space-y-5 fade-in" x-cloak>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5">
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Today Sales' : 'فواتير الجولة'"></span>
                            <div class="w-8 h-8 bg-brand-50 dark:bg-brand-900/30 text-brand-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-truck-moving"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2" x-text="todaySalesCount"></h3>
                        <span class="text-[10px] text-emerald-600 font-bold mt-1 inline-block" x-text="lang === 'en' ? 'Invoices' : 'فاتورة بيع'"></span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Total Income' : 'إجمالي المداخيل'"></span>
                            <div class="w-8 h-8 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-money-bill-wave"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2"><span x-text="totalSalesAmount.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Net Profit' : 'الربح الصافي'"></span>
                            <div class="w-8 h-8 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-chart-line"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2" :class="realNetProfit >= 0 ? 'text-brand-600' : 'text-rose-600'"><span x-text="realNetProfit.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Pending Debts' : 'ديون متبقية'"></span>
                            <div class="w-8 h-8 bg-rose-50 dark:bg-rose-900/30 text-rose-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black text-rose-600 mt-2"><span x-text="totalPendingDebts.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-area text-brand-600"></i><span x-text="lang === 'en' ? 'Sales - Last 7 Days' : 'المبيعات - آخر 7 أيام'"></span></h3>
                        <canvas id="salesChart" height="150"></canvas>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-amber-500"></i><span x-text="lang === 'en' ? 'Products Distribution' : 'توزيع المنتجات'"></span></h3>
                        <canvas id="productsChart" height="150"></canvas>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-sm" x-text="lang === 'en' ? 'Recent Invoices' : 'آخر الفواتير'"></h3>
                        <button @click="currentTab = 'sales'" class="text-xs text-brand-600 font-bold hover:underline" x-text="lang === 'en' ? 'View all' : 'عرض الكل'"></button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 font-bold border-b border-slate-100 dark:border-slate-700">
                                <tr>
                                    <th class="p-2.5">#</th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Customer' : 'الزبون'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Products' : 'المنتجات'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Amount' : 'المبلغ'"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-for="s in recentSales" :key="s.id">
                                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                        <td class="p-2.5 font-mono text-slate-400" x-text="'#' + String(s.id).slice(-4)"></td>
                                        <td class="p-2.5 font-bold" x-text="s.customerName"></td>
                                        <td class="p-2.5"><span x-text="saleItemsSummary(s)"></span></td>
                                        <td class="p-2.5 font-black text-brand-700" x-text="saleTotal(s).toLocaleString() + ' ' + currency"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
                    <!-- SALES TAB -->
            <div x-show="currentTab === 'sales'" class="space-y-4 fade-in" x-cloak>
                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm flex flex-wrap gap-3 items-center">
                    <div class="relative flex-1 min-w-[200px]">
                        <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input x-model="salesSearch" :placeholder="lang === 'en' ? 'Search customer...' : 'بحث بالزبون...'" class="w-full pr-10 pl-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-sm">
                    </div>
                    <button @click="openModal('sale')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'en' ? 'New Invoice' : 'فاتورة جديدة'"></span></button>
                </div>

                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 font-bold">
                                <tr>
                                    <th class="p-3">#</th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Customer' : 'الزبون'"></th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Products' : 'المنتجات'"></th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Amount' : 'المبلغ'"></th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Actions' : 'إجراءات'"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-for="s in filteredSales" :key="s.id">
                                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                        <td class="p-3 font-mono text-slate-400" x-text="'#' + String(s.id).slice(-4)"></td>
                                        <td class="p-3 font-bold" x-text="s.customerName"></td>
                                        <td class="p-3"><span x-text="saleItemsSummary(s)"></span></td>
                                        <td class="p-3 font-black text-brand-700" x-text="saleTotal(s).toLocaleString() + ' ' + currency"></td>
                                        <td class="p-3 flex gap-1.5">
                                            <button @click="printReceipt(s)" class="text-slate-400 hover:text-brand-600" title="طباعة"><i class="fa-solid fa-print"></i></button>
                                            <button @click="deleteSale(s)" class="text-slate-400 hover:text-rose-600" title="حذف"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="filteredSales.length === 0">
                                    <tr><td colspan="5" class="p-8 text-center text-slate-400" x-text="lang === 'en' ? 'No sales found' : 'لا توجد مبيعات'"></td></tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- INVENTORY TAB -->
            <div x-show="currentTab === 'inventory'" class="space-y-4 fade-in" x-cloak>
                <div class="flex items-center justify-between flex-wrap gap-3">
                    <h3 class="font-bold" x-text="lang === 'en' ? 'Vehicle Inventory' : 'مخزون السيارة'"></h3>
                    <button @click="openModal('inventory')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'en' ? 'Add Product' : 'إضافة منتج'"></span></button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input x-model="inventorySearch" :placeholder="lang === 'en' ? 'Search product...' : 'بحث بالمنتج...'" class="w-full pr-10 pl-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-sm">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="item in filteredInventory" :key="item.id">
                        <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border shadow-sm" :class="item.stock < 5 ? 'border-rose-300' : 'border-slate-100 dark:border-slate-800'">
                            <div class="flex items-start gap-3">
                                <template x-if="item.image"><img :src="item.image" class="w-14 h-14 rounded-xl object-cover"></template>
                                <template x-if="!item.image"><div class="w-14 h-14 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-image text-slate-400"></i></div></template>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-sm truncate" x-text="item.name"></h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5" x-text="item.category || (lang === 'en' ? 'General' : 'عام')"></p>
                                </div>
                                <button @click="deleteInventory(item.id)" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
                                <div class="bg-slate-50 dark:bg-slate-800 rounded-lg p-2"><span class="text-[10px] text-slate-400 block" x-text="lang === 'en' ? 'Sell' : 'بيع'"></span><span class="font-black text-brand-700" x-text="item.sellPrice.toLocaleString() + ' ' + currency"></span></div>
                                <div class="bg-slate-50 dark:bg-slate-800 rounded-lg p-2"><span class="text-[10px] text-slate-400 block" x-text="lang === 'en' ? 'Buy' : 'شراء'"></span><span class="font-black text-slate-600" x-text="(item.buyPrice || 0).toLocaleString() + ' ' + currency"></span></div>
                            </div>
                            <div class="flex items-center justify-between mt-3">
                                <span class="text-xs text-slate-500" x-text="lang === 'en' ? 'Stock:' : 'المخزون:'"></span>
                                <span class="text-sm font-black px-2 py-0.5 rounded-lg" :class="item.stock < 5 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'" x-text="item.stock"></span>
                            </div>
                            <div class="flex items-center gap-1 mt-2">
                                <button @click="adjustStock(item.id, -1)" class="flex-1 bg-slate-100 dark:bg-slate-800 py-1.5 rounded-lg text-xs font-bold">−</button>
                                <button @click="adjustStock(item.id, 1)" class="flex-1 bg-slate-100 dark:bg-slate-800 py-1.5 rounded-lg text-xs font-bold">+</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
                        <!-- CUSTOMERS TAB -->
            <div x-show="currentTab === 'customers'" class="space-y-4 fade-in" x-cloak>
                <div class="flex items-center justify-between flex-wrap gap-3">
                    <div class="relative flex-1 min-w-[200px] max-w-md">
                        <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input x-model="customersSearch" :placeholder="lang === 'en' ? 'Search customer...' : 'بحث بالزبون...'" class="w-full pr-10 pl-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-sm">
                    </div>
                    <button @click="openModal('customer')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-user-plus mr-1"></i> <span x-text="lang === 'en' ? 'New Customer' : 'زبون جديد'"></span></button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="c in filteredCustomers" :key="c.id">
                        <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-brand-100 dark:bg-brand-900/30 text-brand-700 flex items-center justify-center font-black"><span x-text="c.name.charAt(0)"></span></div>
                                    <div><h4 class="font-bold text-sm" x-text="c.name"></h4><p class="text-[11px] text-slate-400" x-text="c.phone || (lang === 'en' ? 'No phone' : 'بدون هاتف')"></p></div>
                                </div>
                                <button @click="deleteCustomer(c.id)" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                            <div class="mt-3 text-xs space-y-1 border-t border-slate-100 dark:border-slate-800 pt-2">
                                <div class="flex justify-between"><span class="text-slate-500" x-text="lang === 'en' ? 'Total:' : 'إجمالي الشراء:'"></span><span class="font-bold" x-text="getCustomerTotal(c.id).toLocaleString() + ' ' + currency"></span></div>
                                <div class="flex justify-between"><span class="text-slate-500" x-text="lang === 'en' ? 'Debts:' : 'ديون:'"></span><span class="font-bold" :class="getCustomerDebt(c.id) > 0 ? 'text-rose-600' : 'text-emerald-600'" x-text="getCustomerDebt(c.id).toLocaleString() + ' ' + currency"></span></div>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button @click="viewCustomerHistory(c)" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs py-1.5 rounded-lg font-bold"><i class="fa-solid fa-list mr-1"></i> <span x-text="lang === 'en' ? 'History' : 'السجل'"></span></button>
                                <button x-show="c.phone" @click="callCustomer(c.phone)" class="bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-phone text-xs"></i></button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- DEBTS TAB -->
            <div x-show="currentTab === 'debts'" class="space-y-4 fade-in" x-cloak>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

                // ============ التهيئة ============
                initApp() {
                    this.loadFromStorage();

                    this.loadDarkMode();
                    document.documentElement.setAttribute('dir', this.dir);

                    if (this.lang === 'en') document.body.style.fontFamily = 'Arial, sans-serif';
                    
                    this.$watch('currentTab', () => this.$nextTick(() => this.renderCharts()));
                    this.$watch('sales', () => this.saveToStorage());
                    this.$watch('inventory', () => this.saveToStorage());
                    this.$watch('customers', () => this.saveToStorage());
                    this.$watch('debts', () => this.saveToStorage());
                    this.$watch('debtPayments', () => this.saveToStorage());
                    this.$watch('expenses', () => this.saveToStorage());

                // ============ حفظ واسترجاع البيانات ============
                saveToStorage() {
                    try {
                        localStorage.setItem('merchant_data', JSON.stringify({
                            sales: this.sales, inventory: this.inventory, customers: this.customers, debts: this.debts,
                            debtPayments: this.debtPayments, expenses: this.expenses, closedShifts: this.closedShifts,
                            shiftNumber: this.shiftNumber, shiftStartDate: this.shiftStartDate, shopInfo: this.shopInfo
                        }));
                    } catch(e) { console.warn('Storage error', e); }
                },

                loadFromStorage() {
                    try {
                        const d = JSON.parse(localStorage.getItem('merchant_data') || '{}');
                        this.sales = d.sales || []; this.inventory = d.inventory || []; this.customers = d.customers || [];
                        this.debts = d.debts || []; this.debtPayments = d.debtPayments || []; this.expenses = d.expenses || [];
                        this.closedShifts = d.closedShifts || []; this.shiftNumber = d.shiftNumber || 1;
                        this.shiftStartDate = d.shiftStartDate || new Date().toISOString().split('T')[0];
                        this.shopInfo = d.shopInfo || { name: 'التاجر المتنقل', phone: '', address: '', logo: null };
                    } catch(e) { console.warn('Load error', e); }
                },

                exportData() {
                    const blob = new Blob([JSON.stringify({ sales: this.sales, inventory: this.inventory, customers: this.customers, debts: this.debts, debtPayments: this.debtPayments, expenses: this.expenses, closedShifts: this.closedShifts, shiftNumber: this.shiftNumber, shiftStartDate: this.shiftStartDate, shopInfo: this.shopInfo, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `merchant-backup-${new Date().toISOString().split('T')[0]}.json`; a.click();
                    this.toast(this.lang === 'en' ? 'Backup exported' : 'تم تصدير النسخة الاحتياطية', 'success');
                },

                // ============ الدوال المساعدة (Helpers) ============
                getBadgeCount(tab) {
                    if (tab === 'sales') return this.sales.filter(s => s.status === 'pending').length;
                    if (tab === 'debts') return this.debts.filter(d => d.status !== 'paid').length;
                    if (tab === 'expenses') return this.expenses.length;
                    return 0;
                },
                statusBadgeClass(st) { return { paid: 'bg-emerald-100 text-emerald-700', pending: 'bg-amber-100 text-amber-700', debt: 'bg-rose-100 text-rose-700' }[st] || 'bg-slate-100 text-slate-600'; },
                statusText(st) { return { paid: 'مدفوع', pending: 'معلق', debt: 'دين' }[st] || st; },
                paymentMethodText(m) { return { cash: 'نقدي', credit: 'دين', partial: 'دفع جزئي' }[m] || 'نقدي'; },
                expenseTypeText(t) { return { fuel: '⛽ وقود', maintenance: '🔧 صيانة', food: '🍽️ طعام', toll: '🛣️ رسوم طريق', parking: '🅿️ موقف', phone: '📱 اتصالات', other: '📦 أخرى' }[t] || t; },
                
                toast(message, type = 'success') {
                    const id = ++this.toastId;
                    this.toasts.push({ id, message, type });
                    setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3000);
                },
                pushNotification(type, title, message) {
                    this.notifications.unshift({ type, title, message, read: false, time: new Date().toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' }) });
                },
                markAllRead() { this.notifications = this.notifications.map(n => ({...n, read: true})); },
                getProductImage(inventoryId) { const p = this.inventory.find(i => i.id === inventoryId); return p ? p.image : null; },

                // ============ حسابات السلة ============
                get cartTotal() { return this.cart.reduce((sum, i) => sum + (i.itemPrice * i.quantity), 0); },
                get cartItemCount() { return this.cart.reduce((sum, i) => sum + i.quantity, 0); },
                get editCartTotal() { if (!this.editSaleForm.items) return 0; return this.editSaleForm.items.reduce((sum, i) => sum + (i.itemPrice * i.quantity), 0); },
                get priceEditTotal() { if (!this.priceEditSale || !this.priceEditSale.items) return 0; return this.priceEditSale.items.reduce((sum, i) => sum + (i.itemPrice * i.quantity), 0); },
                saleTotal(sale) { if (!sale || !sale.items) return 0; return sale.items.reduce((sum, i) => sum + (i.itemPrice * i.quantity), 0); },
                saleItemsSummary(sale) { if (!sale || !sale.items || sale.items.length === 0) return '—'; if (sale.items.length === 1) return sale.items[0].itemName + ' × ' + sale.items[0].quantity; return sale.items[0].itemName + ' (+' + (sale.items.length - 1) + ' منتج)'; },
                
                // ============ السلة ============
                onCartProductSelect() { const p = this.inventory.find(i => i.id == this.cartItemForm.inventoryId); if (p) this.cartItemForm.itemPrice = p.sellPrice; },
                addToCart() {
                    const p = this.inventory.find(i => i.id == this.cartItemForm.inventoryId);
                    if (!p) return this.toast(this.lang === 'en' ? 'Select a valid product' : 'اختر منتج صحيح', 'error');
                    if (this.cartItemForm.quantity < 1) return this.toast(this.lang === 'en' ? 'Quantity must be at least 1' : 'الكمية يجب أن تكون 1 على الأقل', 'error');
                    const inCart = this.cart.filter(c => c.inventoryId === p.id).reduce((s, c) => s + c.quantity, 0);
                    if (inCart + this.cartItemForm.quantity > p.stock) return this.toast((this.lang === 'en' ? 'Not enough stock (Available: ' : 'الكمية غير متوفرة (المتوفر: ') + p.stock + ')', 'error');
                    const existing = this.cart.find(c => c.inventoryId === p.id);
                    if (existing) { existing.quantity += this.cartItemForm.quantity; existing.itemPrice = this.cartItemForm.itemPrice; } 
                    else { this.cart.push({ inventoryId: p.id, itemName: p.name, itemPrice: this.cartItemForm.itemPrice || p.sellPrice, quantity: this.cartItemForm.quantity }); }
                    this.cartItemForm = { inventoryId: '', quantity: 1, itemPrice: 0 };
                    this.toast(this.lang === 'en' ? 'Added to cart' : 'تمت إضافة المنتج للسلة', 'success');
                },
                removeFromCart(index) { this.cart.splice(index, 1); },
                updateCartQuantity(index, delta) {
                    const item = this.cart[index];
                    const p = this.inventory.find(i => i.id === item.inventoryId);
                    const newQty = item.quantity + delta;
                    if (newQty < 1) return this.removeFromCart(index);
                    if (p && newQty > p.stock) return this.toast((this.lang === 'en' ? 'Max available: ' : 'الكمية القصوى المتوفرة: ') + p.stock, 'warning');
                    item.quantity = newQty;
                },
                updateCartPrice(index, newPrice) { this.cart[index].itemPrice = Number(newPrice) || 0; },

                // ============ دوال اللغة والعملة ============
                toggleLanguage() {
                    this.lang = this.lang === 'ar' ? 'en' : 'ar';
                    this.dir = this.lang === 'en' ? 'ltr' : 'rtl';
                    localStorage.setItem('lang', this.lang);
                    document.documentElement.setAttribute('dir', this.dir);
                    document.documentElement.setAttribute('lang', this.lang);
                    document.body.style.fontFamily = this.lang === 'en' ? 'Arial, sans-serif' : "'Cairo', sans-serif";
                    this.toast(this.lang === 'en' ? 'Language: English' : 'اللغة: العربية', 'success');
                },
                cycleCurrency() {
                    const currencies = ['د.ج', '€', '$', 'د.م', 'ر.س', 'د.إ', 'ج.م', 'د.ت'];
                    let currentIndex = currencies.indexOf(this.currency);
                    if (currentIndex === -1) currentIndex = 0;
                    this.currency = currencies[(currentIndex + 1) % currencies.length];
                    localStorage.setItem('currency', this.currency);
                    this.toast((this.lang === 'en' ? 'Currency: ' : 'العملة: ') + this.currency, 'success');
                },
                                // ============ الإحصائيات (Getters) ============
                get todaySalesCount() { const today = new Date().toISOString().split('T')[0]; return this.sales.filter(s => s.date === today).length; },
                get totalSalesAmount() { return this.sales.reduce((s, x) => s + this.saleTotal(x), 0); },
                get netProfits() { return this.sales.reduce((sum, s) => { let saleCost = 0; (s.items || []).forEach(item => { const p = this.inventory.find(i => i.id === item.inventoryId); if (p) saleCost += p.buyPrice * item.quantity; }); return sum + (this.saleTotal(s) - saleCost); }, 0); },
                get totalExpenses() { return this.expenses.reduce((s, e) => s + Number(e.amount || 0), 0); },
                get realNetProfit() { return this.netProfits - this.totalExpenses; },
                get totalPendingDebts() { return this.debts.reduce((s, d) => s + (d.totalAmount - d.paidAmount), 0); },
                get totalPaidDebts() { return this.debts.reduce((s, d) => s + d.paidAmount, 0); },
                get pendingDebtsCount() { return this.debts.filter(d => d.status !== 'paid').length; },
                get unreadCount() { return this.notifications.filter(n => !n.read).length; },
                get recentSales() { return this.sales.slice(0, 5); },
                get lastShift() { return this.closedShifts.length > 0 ? this.closedShifts[0] : null; },
                get filteredSales() {
                    return this.sales.filter(s => {
                        const search = this.salesSearch.toLowerCase();
                        const matchSearch = !this.salesSearch || s.customerName.toLowerCase().includes(search) || (s.items || []).some(i => i.itemName.toLowerCase().includes(search));
                        const matchFilter = !this.salesFilter || s.status === this.salesFilter;
                        return matchSearch && matchFilter;
                    });
                },
                get filteredCustomers() {
                    if (!this.customersSearch) return this.customers;
                    const q = this.customersSearch.toLowerCase();
                    return this.customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
                },
                get filteredInventory() {
                    if (!this.inventorySearch) return this.inventory;
                    const q = this.inventorySearch.toLowerCase();
                    return this.inventory.filter(i => i.name.toLowerCase().includes(q) || (i.barcode || '').includes(q) || (i.category || '').toLowerCase().includes(q));
                },
                getCustomerTotal(cid) {
                    const cust = this.customers.find(c => c.id === cid);
                    if (!cust) return 0;
                    return this.sales.filter(s => s.customerName === cust.name).reduce((sum, s) => sum + this.saleTotal(s), 0);
                },
                getCustomerDebt(cid) {
                    const cust = this.customers.find(c => c.id === cid);
                    if (!cust) return 0;
                    return this.debts.filter(d => d.customerName === cust.name).reduce((sum, d) => sum + (d.totalAmount - d.paidAmount), 0);
                },

                // ============ البحث الذكي ============
                updateCustomerSuggestions() {
                    if (!this.saleForm.customerName) { this.customerSuggestions = []; return; }
                    const q = this.saleForm.customerName.toLowerCase();
                    this.customerSuggestions = this.customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
                },
                updateProductSuggestions() {
                    if (!this.cartProductSearch) { this.productSuggestions = []; return; }
                    const q = this.cartProductSearch.toLowerCase();
                    this.productSuggestions = this.inventory.filter(p => p.name.toLowerCase().includes(q) || (p.barcode || '').includes(q) || (p.category || '').toLowerCase().includes(q));
                },
                selectProductFromSearch(p) { this.cartItemForm.inventoryId = p.id; this.cartItemForm.itemPrice = p.sellPrice; this.cartProductSearch = p.name; this.productSuggestions = []; },

                // ============ إدارة النوافذ ============
                openModal(type) {
                    this.modals[type] = true;
                    if (type === 'sale') {
                        this.saleForm = { customerName: '', inventoryId: '', quantity: 1, itemPrice: 0, paymentMethod: 'cash', paidAmount: 0 };
                        this.cart = [];
                        this.cartItemForm = { inventoryId: '', quantity: 1, itemPrice: 0 };
                        this.cartProductSearch = '';
                        this.customerSuggestions = [];
                        this.productSuggestions = [];
                    }
                    if (type === 'inventory') this.invForm = { name: '', category: '', buyPrice: 0, sellPrice: 0, stock: 0, image: null, barcode: '' };
                    if (type === 'customer') this.custForm = { name: '', phone: '', address: '', notes: '', lat: null, lng: null };
                    if (type === 'expense') this.expenseForm = { type: 'fuel', amount: 0, description: '' };
                },
                closeModal(type) { this.modals[type] = false; },
                openSettings() { this.modals.settings = true; },
                saveSettings() { this.closeModal('settings'); this.toast(this.lang === 'en' ? 'Settings saved' : 'تم حفظ الإعدادات', 'success'); },
                viewProductImage(item) { if (item.image) { this.viewImageSrc = item.image; this.modals.viewImage = true; } },

                // ============ تحديد الموقع (GPS) ============
                getGeoLocation() {
                    if (!navigator.geolocation) return this.toast('متصفحك لا يدعم تحديد الموقع الجغرافي', 'error');
                    this.toast('جاري جلب إحداثيات موقعك...', 'info');
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            this.custForm.lat = position.coords.latitude;
                            this.custForm.lng = position.coords.longitude;
                            if(!this.custForm.address) this.custForm.address = 'موقع GPS مباشر';
                            this.toast('تم تحديد الموقع بنجاح 📍', 'success');
                        },
                        () => { this.toast('فشل جلب الموقع، تأكد من تفعيل الـ GPS', 'error'); },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                },
                                // ============ إضافة فاتورة بيع ============
                addSale() {
                    if (this.cart.length === 0) return this.toast(this.lang === 'en' ? 'Cart is empty' : 'السلة فارغة', 'error');
                    if (!this.saleForm.customerName) return this.toast(this.lang === 'en' ? 'Enter customer name' : 'أدخل اسم الزبون', 'error');
                    const total = this.cartTotal;
                    const sale = {
                        id: Date.now(),
                        customerName: this.saleForm.customerName,
                        items: JSON.parse(JSON.stringify(this.cart)),
                        status: this.saleForm.paymentMethod === 'cash' ? 'paid' : (this.saleForm.paymentMethod === 'partial' ? 'pending' : 'debt'),
                        paymentMethod: this.saleForm.paymentMethod,
                        date: new Date().toISOString().split('T')[0]
                    };
                    this.sales.unshift(sale);
                    this.cart.forEach(c => { const p = this.inventory.find(i => i.id === c.inventoryId); if (p) p.stock -= c.quantity; });
                    if (this.saleForm.paymentMethod !== 'cash') {
                        const paid = this.saleForm.paymentMethod === 'partial' ? (this.saleForm.paidAmount || 0) : 0;
                        this.debts.unshift({ id: Date.now(), customerName: this.saleForm.customerName, totalAmount: total, paidAmount: paid, status: paid >= total ? 'paid' : (paid > 0 ? 'partial' : 'unpaid'), date: sale.date, saleId: sale.id });
                    }
                    if (!this.customers.find(c => c.name === this.saleForm.customerName)) {
                        this.customers.push({ id: Date.now(), name: this.saleForm.customerName, phone: '', address: '', notes: '', lat: null, lng: null });
                    }
                    this.closeModal('sale');
                    this.toast(this.lang === 'en' ? 'Invoice saved' : 'تم حفظ الفاتورة بنجاح', 'success');
                    this.pushNotification('sale', 'فاتورة جديدة', `${sale.customerName} - ${total.toLocaleString()} ${this.currency}`);
                    this.checkStockAlerts();
                },

                // ============ تعديل الفاتورة ============
                openEditSale(sale) {
                    this.editSaleForm = { id: sale.id, customerName: sale.customerName, items: JSON.parse(JSON.stringify(sale.items)) };
                    this.modals.editSale = true;
                },
                saveEditSale() {
                    const original = this.sales.find(s => s.id === this.editSaleForm.id); if (!original) return;
                    if (this.editSaleForm.items.length === 0) return this.toast('الفاتورة فارغة', 'error');
                    original.items.forEach(oldItem => { const p = this.inventory.find(i => i.id === oldItem.inventoryId); if (p) p.stock += oldItem.quantity; });
                    for (const newItem of this.editSaleForm.items) {
                        const p = this.inventory.find(i => i.id === newItem.inventoryId);
                        if (!p) { original.items.forEach(oi => { const pp = this.inventory.find(i => i.id === oi.inventoryId); if (pp) pp.stock -= oi.quantity; }); return this.toast('منتج غير موجود', 'error'); }
                        if (p.stock < newItem.quantity) { this.editSaleForm.items.forEach(ni => { const pp = this.inventory.find(i => i.id === ni.inventoryId); if (pp) pp.stock += ni.quantity; }); original.items.forEach(oi => { const pp = this.inventory.find(i => i.id === oi.inventoryId); if (pp) pp.stock -= oi.quantity; }); return this.toast(`كمية ${p.name} غير متوفرة`, 'error'); }
                        p.stock -= newItem.quantity;
                    }
                    original.customerName = this.editSaleForm.customerName;
                    original.items = JSON.parse(JSON.stringify(this.editSaleForm.items));
                    const linkedDebt = this.debts.find(d => d.saleId === original.id);
                    if (linkedDebt) {
                        const newTotal = this.saleTotal(original);
                        linkedDebt.totalAmount = newTotal;
                        linkedDebt.paidAmount = Math.min(linkedDebt.paidAmount, newTotal);
                        linkedDebt.status = linkedDebt.paidAmount >= newTotal ? 'paid' : (linkedDebt.paidAmount > 0 ? 'partial' : 'unpaid');
                    }
                    this.closeModal('editSale');
                    this.toast(this.lang === 'en' ? 'Invoice updated' : 'تم التحديث', 'success');
                },

                // ============ تعديل السعر ============
                openPriceModal(sale) { this.priceEditSale = JSON.parse(JSON.stringify(sale)); this.modals.priceEdit = true; },
                updateSaleItemPrice(idx, newPrice) { this.priceEditSale.items[idx].itemPrice = Number(newPrice) || 0; },
                savePriceEdit() {

updateCustomerSuggestions() { if (!this.saleForm.customerName) { this.customerSuggestions = []; return; } const q = this.saleForm.customerName.toLowerCase(); this.customerSuggestions = this.customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)); },
updateProductSuggestions() { if (!this.cartProductSearch) { this.productSuggestions = []; return; } const q = this.cartProductSearch.toLowerCase(); this.productSuggestions = this.inventory.filter(p => p.name.toLowerCase().includes(q) || (p.barcode || '').includes(q)); },
selectProductFromSearch(p) { this.cartItemForm.inventoryId = p.id; this.cartItemForm.itemPrice = p.sellPrice; this.cartProductSearch = p.name; this.productSuggestions = []; },
get todaySalesCount() { const today = new Date().toISOString().split('T')[0]; return this.sales.filter(s => s.date === today).length; },
get totalSalesAmount() { return this.sales.reduce((s, x) => s + this.saleTotal(x), 0); },
get netProfits() { return this.sales.reduce((sum, s) => { let saleCost = 0; (s.items || []).forEach(item => { const p = this.inventory.find(i => i.id === item.inventoryId); if (p) saleCost += p.buyPrice * item.quantity; }); return sum + (this.saleTotal(s) - saleCost); }, 0); },
get totalExpenses() { return this.expenses.reduce((s, e) => s + Number(e.amount || 0), 0); },
get realNetProfit() { return this.netProfits - this.totalExpenses; },
get totalPendingDebts() { return this.debts.reduce((s, d) => s + (d.totalAmount - d.paidAmount), 0); },
get pendingDebtsCount() { return this.debts.filter(d => d.status !== 'paid').length; },
get unreadCount() { return this.notifications.filter(n => !n.read).length; },
get filteredSales() { return this.sales.filter(s => { const search = this.salesSearch.toLowerCase(); const matchSearch = !this.salesSearch || s.customerName.toLowerCase().includes(search) || (s.items || []).some(i => i.itemName.toLowerCase().includes(search)); const matchFilter = !this.salesFilter || s.status === this.salesFilter; return matchSearch && matchFilter; }); },
get filteredCustomers() { if (!this.customersSearch) return this.customers; const q = this.customersSearch.toLowerCase(); return this.customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)); },
get filteredInventory() { if (!this.inventorySearch) return this.inventory; const q = this.inventorySearch.toLowerCase(); return this.inventory.filter(i => i.name.toLowerCase().includes(q) || (i.barcode || '').includes(q)); },
getCustomerTotal(cid) { const cust = this.customers.find(c => c.id === cid); if (!cust) return 0; return this.sales.filter(s => s.customerName === cust.name).reduce((sum, s) => sum + this.saleTotal(s), 0); },
getCustomerDebt(cid) { const cust = this.customers.find(c => c.id === cid); if (!cust) return 0; return this.debts.filter(d => d.customerName === cust.name).reduce((sum, d) => sum + (d.totalAmount - d.paidAmount), 0); },
openModal(type) { this.modals[type] = true; if (type === 'sale') { this.saleForm = { customerName: '', inventoryId: '', quantity: 1, itemPrice: 0, paymentMethod: 'cash', paidAmount: 0 }; this.cart = []; this.cartItemForm = { inventoryId: '', quantity: 1, itemPrice: 0 }; this.cartProductSearch = ''; this.customerSuggestions = []; this.productSuggestions = []; } if (type === 'inventory') this.invForm = { name: '', category: '', buyPrice: 0, sellPrice: 0, stock: 0, image: null, barcode: '' }; if (type === 'customer') this.custForm = { name: '', phone: '', address: '', notes: '', lat: null, lng: null }; if (type === 'expense') this.expenseForm = { type: 'fuel', amount: 0, description: '' }; },
closeModal(type) { this.modals[type] = false; },
openSettings() { this.modals.settings = true; },
saveSettings() { this.closeModal('settings'); this.toast('تم الحفظ', 'success'); },
viewProductImage(item) { if (item.image) { this.viewImageSrc = item.image; this.modals.viewImage = true; } },
addSale() { if (this.cart.length === 0) return; const total = this.cartTotal; const sale = { id: Date.now(), customerName: this.saleForm.customerName, items: JSON.parse(JSON.stringify(this.cart)), status: 'paid', paymentMethod: this.saleForm.paymentMethod, date: new Date().toISOString().split('T')[0] }; this.sales.unshift(sale); this.cart.forEach(c => { const p = this.inventory.find(i => i.id === c.inventoryId); if (p) p.stock -= c.quantity; }); this.closeModal('sale'); this.toast('تم حفظ الفاتورة', 'success'); },
openEditSale(sale) { this.editSaleForm = { id: sale.id, customerName: sale.customerName, items: JSON.parse(JSON.stringify(sale.items)) }; this.modals.editSale = true; },
saveEditSale() { const original = this.sales.find(s => s.id === this.editSaleForm.id); if (original) { original.items = JSON.parse(JSON.stringify(this.editSaleForm.items)); original.customerName = this.editSaleForm.customerName; this.closeModal('editSale'); this.toast('تم التحديث', 'success'); } },
deleteSale(sale) { this.sales = this.sales.filter(s => s.id !== sale.id); this.toast('تم الحذف', 'success'); },
printReceipt(sale) { const total = this.saleTotal(sale); const itemsRows = (sale.items || []).map(i => `<tr><td>${i.itemName}</td><td>${i.quantity}</td><td>${i.itemPrice}</td><td>${i.itemPrice*i.quantity}</td></tr>`).join(''); const html = `<div dir="rtl"><h2>${this.shopInfo.name}</h2><p>${sale.customerName}</p><table>${itemsRows}</table><p>Total: ${total} ${this.currency}</p></div>`; document.getElementById('receiptPrint').innerHTML = html; window.print(); },
sendWhatsApp(sale) { window.open('https://wa.me/?text=' + encodeURIComponent('فاتورة: ' + this.saleTotal(sale) + ' ' + this.currency), '_blank'); },
addInventory() { this.inventory.push({ ...this.invForm, id: Date.now(), maxStock: 50 }); this.closeModal('inventory'); this.toast('تمت الإضافة', 'success'); },
deleteInventory(id) { this.inventory = this.inventory.filter(i => i.id !== id); this.toast('تم الحذف', 'success'); },
adjustStock(id, delta) { const p = this.inventory.find(i => i.id === id); if (p) p.stock = Math.max(0, p.stock + delta); },
addCustomer() { this.customers.push({ ...this.custForm, id: Date.now() }); this.closeModal('customer'); this.toast('تمت الإضافة', 'success'); },
deleteCustomer(id) { this.customers = this.customers.filter(c => c.id !== id); this.toast('تم الحذف', 'success'); },
addExpense() { this.expenses.unshift({ id: Date.now(), type: this.expenseForm.type, amount: Number(this.expenseForm.amount), description: this.expenseForm.description, date: new Date().toISOString().split('T')[0] }); this.closeModal('expense'); this.toast('تم الحفظ', 'success'); },
openClotureConfirm() { this.closedShifts.unshift({ id: Date.now(), number: this.shiftNumber, totalSales: this.totalSalesAmount, totalExpenses: this.totalExpenses, realNetProfit: this.realNetProfit, sales: JSON.parse(JSON.stringify(this.sales)) }); this.sales = []; this.expenses = []; this.shiftNumber += 1; this.toast('تم إغلاق الجولة', 'success'); },
confirmAction() { if (this.pendingConfirm) this.pendingConfirm(); this.modals.confirm = false; },
changeCurrency(newCurrency) { this.currency = newCurrency; localStorage.setItem('currency', newCurrency); },
cycleCurrency() { const currencies = ['د.ج', '€', '$', 'د.م', 'ر.س']; let currentIndex = currencies.indexOf(this.currency); if (currentIndex === -1) currentIndex = 0; this.currency = currencies[(currentIndex + 1) % currencies.length]; localStorage.setItem('currency', this.currency); },
toggleLanguage() { this.lang = this.lang === 'ar' ? 'en' : 'ar'; this.dir = this.lang === 'en' ? 'ltr' : 'rtl'; localStorage.setItem('lang', this.lang); document.documentElement.setAttribute('dir', this.dir); document.documentElement.setAttribute('lang', this.lang); this.toast(this.lang === 'en' ? 'Language: English' : 'اللغة: العربية', 'success'); },
toggleDark() { this.darkMode = !this.darkMode; document.documentElement.classList.toggle('dark', this.darkMode); localStorage.setItem('darkMode', this.darkMode); },
loadDarkMode() { this.darkMode = localStorage.getItem('darkMode') === 'true'; document.documentElement.classList.toggle('dark', this.darkMode); },
checkStockAlerts() { this.inventory.filter(i => i.stock < 5).forEach(i => { if (!this.notifications.find(n => n.type === 'stock' && n.message.includes(i.name))) this.pushNotification('stock', 'نقص مخزون', `${i.name} - المتبقي ${i.stock} فقط`); }); },                                 }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التاجر المتنقل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600: '#16a34a' } }, fontFamily: { sans: ['Cairo', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen p-4" x-data="merchantApp()">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-black mb-4">التاجر المتنقل</h1>
        
        <!-- Dashboard -->
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="bg-green-50 p-4 rounded-xl">
                <span class="text-sm text-gray-500">إجمالي المداخيل</span>
                <h3 class="text-xl font-bold" x-text="totalSalesAmount.toLocaleString() + ' ' + currency"></h3>
            </div>
            <div class="bg-blue-50 p-4 rounded-xl">
                <span class="text-sm text-gray-500">الربح الصافي</span>
                <h3 class="text-xl font-bold" x-text="netProfits.toLocaleString() + ' ' + currency"></h3>
            </div>
        </div>

        <!-- Add Sale -->
        <div class="border-t pt-4 mt-4">
            <h2 class="text-lg font-bold mb-2">إضافة بيع</h2>
            <div class="grid grid-cols-2 gap-2">
                <input x-model="saleForm.customerName" placeholder="اسم الزبون" class="p-2 border rounded">
                <select x-model="saleForm.inventoryId" class="p-2 border rounded">
                    <option value="">اختر منتج</option>
                    <template x-for="p in inventory" :key="p.id">
                        <option :value="p.id" x-text="p.name + ' - ' + p.price"></option>
                    </template>
                </select>
                <input x-model.number="saleForm.quantity" type="number" min="1" class="p-2 border rounded">
                <button @click="addSale()" class="bg-green-600 text-white p-2 rounded">حفظ البيع</button>
            </div>
        </div>

        <!-- List Sales -->
        <div class="mt-4">
            <h2 class="text-lg font-bold mb-2">المبيعات</h2>
            <ul>
                <template x-for="s in sales" :key="s.id">
                    <li class="p-2 border-b flex justify-between">
                        <span x-text="s.customerName + ' - ' + s.itemName + ' x' + s.quantity"></span>
                        <span x-text="(s.price * s.quantity) + ' ' + currency"></span>
                    </li>
                </template>
            </ul>
        </div>
    </div>

    <script>
        function merchantApp() {
            return {
                currency: 'د.ج',
                inventory: [
                    { id: 1, name: 'زيت 5L', price: 1100 },
                    { id: 2, name: 'سكر 1Kg', price: 130 }
                ],
                sales: [],
                saleForm: { customerName: '', inventoryId: '', quantity: 1 },
                get totalSalesAmount() {
                    return this.sales.reduce((sum, s) => sum + (s.price * s.quantity), 0);
                },
                get netProfits() {
                    return this.totalSalesAmount;
                },
                addSale() {
                    if (!this.saleForm.customerName || !this.saleForm.inventoryId) return;
                    const product = this.inventory.find(p => p.id == this.saleForm.inventoryId);
                    if (!product) return;
                    this.sales.push({
                        id: Date.now(),
                        customerName: this.saleForm.customerName,
                        itemName: product.name,
                        price: product.price,
                        quantity: this.saleForm.quantity
                    });
                    this.saleForm = { customerName: '', inventoryId: '', quantity: 1 };
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مبيعات التاجر المتنقل | Mobile Merchant POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', } },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .toast-enter { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; max-height: 200px; overflow-y: auto; z-index: 60; margin-top: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .dark .autocomplete-list { background: #1e293b; border-color: #334155; }
        .autocomplete-list div { padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .autocomplete-list div:hover { background: #f0fdf4; }
        .dark .autocomplete-list div:hover { background: #334155; }
        @media print { body * { visibility: hidden; } #receiptPrint, #receiptPrint * { visibility: visible; } #receiptPrint { position: absolute; left: 0; top: 0; width: 100%; } }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 bg-slate-100 dark:bg-slate-950 antialiased min-h-screen flex flex-col md:flex-row pb-16 md:pb-0" x-data="merchantApp()" x-init="initApp()">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-slate-900 dark:bg-black text-slate-300 flex-shrink-0 z-20 shadow-xl">
        <div class="p-4 flex items-center justify-between border-b border-slate-800">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-van-shuttle text-xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg text-white leading-tight">التاجر المتنقل</h1>
                    <span class="text-xs text-brand-400 font-medium">نظام المبيعات والجولات</span>
                </div>
            </div>
        </div>

        <nav class="hidden md:block p-3 space-y-1">
            <template x-for="item in navItems" :key="item.id">
                <button @click="currentTab = item.id" 
                        :class="currentTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'" 
                        class="w-full flex items-center px-4 py-3 rounded-xl transition font-bold justify-between">
                    <div class="flex items-center">
                        <i class="fa-solid w-6 text-lg" :class="item.icon"></i>
                        <span class="mr-3" x-text="$t_title(item.id)"></span>
                    </div>
                    <span x-show="getBadgeCount(item.id) > 0" 
                          :class="item.id === 'debts' ? 'bg-rose-500' : 'bg-amber-500'"
                          class="text-white text-xs px-2 py-0.5 rounded-full font-bold"
                          x-text="getBadgeCount(item.id)"></span>
                </button>
            </template>

            <div class="pt-3 mt-3 border-t border-slate-800">
                <button @click="toggleDark()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold">
                    <i class="fa-solid w-6 text-lg" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                    <span class="mr-3" x-text="lang === 'en' ? (darkMode ? 'Light Mode' : 'Dark Mode') : (darkMode ? 'الوضع النهاري' : 'الوضع الليلي')"></span>
                </button>
                <button @click="toggleLanguage()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold">
                    <i class="fa-solid fa-language w-6 text-lg"></i>
                    <span class="mr-3" x-text="lang === 'ar' ? 'English (EN)' : 'العربية (AR)'"></span>
                </button>
                <button @click="openSettings()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold">
                    <i class="fa-solid fa-gear w-6 text-lg"></i>
                    <span class="mr-3" x-text="lang === 'en' ? 'Shop Settings' : 'إعدادات المحل'"></span>
                </button>
                <button @click="exportData()" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition font-bold">
                    <i class="fa-solid fa-download w-6 text-lg"></i>
                    <span class="mr-3" x-text="lang === 'en' ? 'Backup' : 'نسخة احتياطية'"></span>
                </button>
            </div>
            <div class="mt-3 p-3 rounded-xl bg-slate-800/50 text-xs flex items-center gap-2">
                <span class="w-2 h-2 rounded-full" :class="online ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></span>
                <span x-text="online ? (lang === 'en' ? 'Online' : 'متصل') : (lang === 'en' ? 'Offline' : 'غير متصل')"></span>
            </div>
        </nav>
    </aside>

    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 dark:bg-black border-t border-slate-800 z-40 flex justify-around p-1.5 text-slate-400 text-[10px] font-bold overflow-x-auto">
        <template x-for="item in navItems" :key="'m-' + item.id">
            <button @click="currentTab = item.id" :class="currentTab === item.id ? 'text-brand-400' : ''" class="flex flex-col items-center py-1 relative px-1.5 flex-shrink-0">
                <i class="fa-solid text-base mb-0.5" :class="item.icon"></i>
                <span x-text="$t_title(item.id)"></span>
                <span x-show="getBadgeCount(item.id) > 0" 
                      :class="item.id === 'debts' ? 'bg-rose-500' : 'bg-amber-500'"
                      class="absolute -top-0.5 right-0 text-white text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold"
                      x-text="getBadgeCount(item.id)"></span>
            </button>
        </template>
    </div>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen overflow-x-hidden">
        <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10 px-3 py-2.5 sm:px-6 sm:py-3 flex items-center justify-between shadow-sm gap-2">
            <h2 class="text-base sm:text-xl font-black flex items-center gap-2 truncate">
                <span x-text="$t_title(currentTab)"></span>
            </h2>
            <div class="flex items-center space-x-1.5 sm:space-x-2 space-x-reverse flex-shrink-0">
                <div class="hidden sm:flex items-center gap-1.5 bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-2.5 py-1.5 rounded-xl text-[10px] font-bold">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span x-text="lang === 'en' ? 'Shift ' + shiftNumber : 'جولة ' + shiftNumber"></span>
                </div>
                <button @click="cycleCurrency()" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold transition hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center gap-1" title="تغيير العملة">
                    <i class="fa-solid fa-money-bill-wave text-brand-600"></i>
                    <span x-text="currency"></span>
                </button>
                <button @click="toggleLanguage()" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold transition hover:bg-slate-200 dark:hover:bg-slate-700" title="تغيير اللغة">
                    <span x-text="lang === 'ar' ? 'EN' : 'AR'"></span>
                </button>
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="relative p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition">
                        <i class="fa-regular fa-bell text-lg sm:text-xl"></i>
                        <span x-show="unreadCount > 0" class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-transition x-cloak class="absolute left-0 mt-2 w-72 sm:w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 py-2 z-50">
                        <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
                            <h3 class="font-bold text-xs" x-text="lang === 'en' ? 'Notifications' : 'تنبيهات'"></h3>
                            <button @click="markAllRead()" class="text-[10px] text-brand-600 hover:underline" x-text="lang === 'en' ? 'Clear all' : 'إخفاء الكل'"></button>
                        </div>
                        <div class="max-h-72 overflow-y-auto divide-y divide-slate-50 dark:divide-slate-700">
                            <template x-for="(n, i) in notifications" :key="i">
                                <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition flex items-start gap-2.5" :class="{'bg-green-50/40 dark:bg-green-900/10': !n.read}">
                                    <div class="p-2 rounded-lg text-white text-xs flex-shrink-0 mt-0.5" :class="{'bg-amber-500': n.type==='stock','bg-brand-600': n.type==='sale','bg-rose-500': n.type==='debt','bg-blue-500': n.type==='system'}">
                                        <i class="fa-solid" :class="{'fa-triangle-exclamation': n.type==='stock','fa-cart-check': n.type==='sale','fa-file-invoice-dollar': n.type==='debt','fa-circle-info': n.type==='system'}"></i>
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-xs font-bold" x-text="n.title"></p>
                                        <p class="text-[11px] text-slate-500 mt-0.5" x-text="n.message"></p>
                                        <span class="text-[9px] text-slate-400 mt-1 block" x-text="n.time"></span>
                                    </div>
                                </div>
                            </template>
                            <template x-if="notifications.length === 0">
                                <div class="p-6 text-center text-slate-400 text-xs">
                                    <i class="fa-regular fa-bell-slash text-3xl mb-2 block opacity-30"></i>
                                    <span x-text="lang === 'en' ? 'No notifications' : 'لا توجد إشعارات'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <button @click="openModal('sale')" class="bg-brand-600 hover:bg-brand-700 text-white px-2.5 sm:px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-brand-500/20 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline" x-text="lang === 'en' ? 'New Invoice' : 'فاتورة جديدة'"></span>
                    <span class="sm:hidden" x-text="lang === 'en' ? 'Sell' : 'بيع'"></span>
                </button>
            </div>
        </header>

        <main class="flex-1 p-3 sm:p-6 space-y-5">
                    <!-- DASHBOARD -->
            <div x-show="currentTab === 'dashboard'" class="space-y-5 fade-in" x-cloak>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5">
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Today Sales' : 'فواتير الجولة'"></span>
                            <div class="w-8 h-8 bg-brand-50 dark:bg-brand-900/30 text-brand-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-truck-moving"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2" x-text="todaySalesCount"></h3>
                        <span class="text-[10px] text-emerald-600 font-bold mt-1 inline-block" x-text="lang === 'en' ? 'Invoices' : 'فاتورة بيع'"></span>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Total Income' : 'إجمالي المداخيل'"></span>
                            <div class="w-8 h-8 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-money-bill-wave"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2"><span x-text="totalSalesAmount.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Net Profit' : 'الربح الصافي'"></span>
                            <div class="w-8 h-8 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-chart-line"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black mt-2" :class="realNetProfit >= 0 ? 'text-brand-600' : 'text-rose-600'"><span x-text="realNetProfit.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-400" x-text="lang === 'en' ? 'Pending Debts' : 'ديون متبقية'"></span>
                            <div class="w-8 h-8 bg-rose-50 dark:bg-rose-900/30 text-rose-600 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                        </div>
                        <h3 class="text-xl sm:text-2xl font-black text-rose-600 mt-2"><span x-text="totalPendingDebts.toLocaleString()"></span> <span class="text-xs font-normal text-slate-400" x-text="currency"></span></h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-area text-brand-600"></i><span x-text="lang === 'en' ? 'Sales - Last 7 Days' : 'المبيعات - آخر 7 أيام'"></span></h3>
                        <canvas id="salesChart" height="150"></canvas>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                        <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-amber-500"></i><span x-text="lang === 'en' ? 'Products Distribution' : 'توزيع المنتجات'"></span></h3>
                        <canvas id="productsChart" height="150"></canvas>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-sm" x-text="lang === 'en' ? 'Recent Invoices' : 'آخر الفواتير'"></h3>
                        <button @click="currentTab = 'sales'" class="text-xs text-brand-600 font-bold hover:underline" x-text="lang === 'en' ? 'View all' : 'عرض الكل'"></button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 font-bold border-b border-slate-100 dark:border-slate-700">
                                <tr>
                                    <th class="p-2.5" x-text="lang === 'en' ? '#' : 'رقم'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Customer' : 'الزبون'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Products' : 'المنتجات'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Amount' : 'المبلغ'"></th>
                                    <th class="p-2.5" x-text="lang === 'en' ? 'Actions' : 'إجراءات'"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-for="s in recentSales" :key="s.id">
                                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                        <td class="p-2.5 font-mono text-slate-400" x-text="'#' + String(s.id).slice(-4)"></td>
                                        <td class="p-2.5 font-bold" x-text="s.customerName"></td>
                                        <td class="p-2.5"><span x-text="saleItemsSummary(s)"></span></td>
                                        <td class="p-2.5 font-black text-brand-700" x-text="saleTotal(s).toLocaleString() + ' ' + currency"></td>
                                        <td class="p-2.5 flex gap-1.5">
                                            <button @click="printReceipt(s)" class="text-slate-400 hover:text-brand-600"><i class="fa-solid fa-print"></i></button>
                                            <button @click="deleteSale(s)" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-slate-900 dark:bg-black text-white p-5 rounded-2xl shadow-lg space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2"><i class="fa-solid fa-boxes-packing text-amber-400 text-lg"></i><h3 class="font-bold text-sm" x-text="lang === 'en' ? 'Vehicle Stock Status' : 'حالة السلع بالسيارة'"></h3></div>
                        <span class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded-xl font-bold" x-text="inventory.length + (lang === 'en' ? ' Items' : ' صنف')"></span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2 text-xs">
                        <template x-for="item in inventory.slice(0, 4)" :key="item.id">
                            <div class="bg-slate-800/80 p-3 rounded-xl border" :class="item.stock < 5 ? 'border-rose-500/50' : 'border-slate-700'">
                                <div class="flex items-center gap-2 mb-1">
                                    <template x-if="item.image"><img :src="item.image" class="w-8 h-8 rounded-lg object-cover"></template>
                                    <template x-if="!item.image"><div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center"><i class="fa-solid fa-box text-slate-500 text-xs"></i></div></template>
                                    <p class="font-bold truncate flex-1" x-text="item.name"></p>
                                </div>
                                <div class="flex items-center justify-between mt-2">
                                    <span class="text-[10px] text-slate-400" x-text="lang === 'en' ? 'Remaining' : 'المتبقي'"></span>
                                    <span class="font-black" :class="item.stock < 5 ? 'text-rose-400' : 'text-emerald-400'" x-text="item.stock"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- SALES -->
            <div x-show="currentTab === 'sales'" class="space-y-4 fade-in" x-cloak>
                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm flex flex-wrap gap-3 items-center">
                    <div class="relative flex-1 min-w-[200px]">
                        <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input x-model="salesSearch" :placeholder="lang === 'en' ? 'Search customer...' : 'بحث بالزبون...'" class="w-full pr-10 pl-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-sm">
                    </div>
                    <button @click="openModal('sale')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'en' ? 'New Invoice' : 'فاتورة جديدة'"></span></button>
                </div>
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 font-bold">
                                <tr>
                                    <th class="p-3">#</th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Customer' : 'الزبون'"></th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Amount' : 'المبلغ'"></th>
                                    <th class="p-3" x-text="lang === 'en' ? 'Actions' : 'إجراءات'"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                <template x-for="s in filteredSales" :key="s.id">
                                    <tr>

                <i class="fa-solid text-sm mt-0.5" :class="{'fa-check-circle text-emerald-500': t.type==='success','fa-times-circle text-rose-500': t.type==='error','fa-exclamation-circle text-amber-500': t.type==='warning','fa-info-circle text-blue-500': t.type==='info'}"></i>

        <!-- ============ APP LOGIC ============ -->
    <script>
        function merchantApp() {
            return {
                // ============ STATE ============
                currentTab: 'dashboard',
                lang: localStorage.getItem('lang') || 'ar',
                dir: localStorage.getItem('lang') === 'en' ? 'ltr' : 'rtl',
                darkMode: false,
                currency: localStorage.getItem('currency') || 'د.ج',
                online: navigator.onLine,
                salesSearch: '',
                salesFilter: '',
                customersSearch: '',
                inventorySearch: '',
                toasts: [],
                toastId: 0,
                notifications: [],
                sales: [],
                inventory: [],
                customers: [],
                debts: [],
                debtPayments: [],
                expenses: [],
                closedShifts: [],
                shiftNumber: 1,
                shiftStartDate: new Date().toISOString().split('T')[0],
                expandedShift: null,
                showLastShiftDetails: false,
                modals: { 
                    sale: false, inventory: false, customer: false, payment: false, 
                    history: false, confirm: false, editSale: false, expense: false,
                    priceEdit: false, editInventory: false, barcode: false, settings: false, viewImage: false
                },
                saleForm: { customerName: '', inventoryId: '', quantity: 1, itemPrice: 0, paymentMethod: 'cash', paidAmount: 0 },
                editSaleForm: { id: null, customerName: '', items: [] },
                invForm: { name: '', category: '', buyPrice: 0, sellPrice: 0, stock: 0, image: null, barcode: '' },
                editInvForm: { id: null, name: '', category: '', buyPrice: 0, sellPrice: 0, stock: 0, image: null, barcode: '' },
                custForm: { name: '', phone: '', address: '', notes: '', lat: null, lng: null },
                expenseForm: { type: 'fuel', amount: 0, description: '' },
                shopInfo: { name: 'التاجر المتنقل', phone: '', address: '', logo: null },
                cart: [],
                cartItemForm: { inventoryId: '', quantity: 1, itemPrice: 0 },
                cartProductSearch: '',
                productSuggestions: [],
                customerSuggestions: [],
                priceEditSale: null,
                barcodeTarget: null,
                barcodeManualInput: '',
                barcodeScanner: null,
                cameraLoading: false,
                cameraError: '',
                viewImageSrc: '',
                selectedDebt: null,
                paymentAmount: 0,
                historyCustomerName: '',
                historyItems: [],
                confirmMsg: '',
                pendingConfirm: null,
                charts: { sales: null, products: null },

                navItems: [
                    { id: 'dashboard', label: 'ملخص المبيعات', short: 'الرئيسية', icon: 'fa-chart-pie' },
                    { id: 'sales', label: 'المبيعات والفواتير', short: 'المبيعات', icon: 'fa-cart-shopping' },
                    { id: 'inventory', label: 'مخزون السيارة', short: 'المخزون', icon: 'fa-boxes-stacked' },
                    { id: 'customers', label: 'الزبائن والملاحظات', short: 'الزبائن', icon: 'fa-address-book' },
                    { id: 'debts', label: 'دفتر الديون', short: 'الديون', icon: 'fa-book-bookmark' },
                    { id: 'expenses', label: 'مصاريف الجولة', short: 'مصاريف', icon: 'fa-gas-pump' },
                    { id: 'archive', label: 'أرشيف الجولات', short: 'أرشيف', icon: 'fa-box-archive' },
                ],

                tabTitles: {
                    ar: { dashboard: 'ملخص المبيعات', sales: 'المبيعات والفواتير', inventory: 'مخزون السيارة/الحافلة', customers: 'الزبائن والملاحظات', debts: 'دفتر الديون', expenses: 'مصاريف الجولة الميدانية', archive: 'أرشيف الجولات المغلقة' },
                    en: { dashboard: 'Dashboard', sales: 'Sales & Invoices', inventory: 'Vehicle Inventory', customers: 'Customers & Notes', debts: 'Debts Book', expenses: 'Trip Expenses', archive: 'Archive' }
                },
                
                translations: {
                    ar: { totalPurchase: 'إجمالي الشراء:', remainingDebts: 'ديون متبقية:', history: 'السجل', map: 'الخريطة' },
                    en: { totalPurchase: 'Total Purchase:', remainingDebts: 'Remaining Debts:', history: 'History', map: 'Map' }
                },

                $t(key) { return this.translations[this.lang][key] || key; },
                $t_title(key) { return this.tabTitles[this.lang][key] || key; },

                initApp() {
                    this.loadFromStorage();
                    if (this.sales.length === 0 && this.closedShifts.length === 0) this.seedDemoData();
                    this.loadDarkMode();
                    document.documentElement.setAttribute('dir', this.dir);
                    document.documentElement.setAttribute('lang', this.lang);
                    if (this.lang === 'en') document.body.style.fontFamily = 'Arial, sans-serif';
                    
                    window.addEventListener('online', () => { this.online = true; this.toast(this.lang === 'en' ? 'Back online' : 'عاد الاتصال', 'success'); });
                    window.addEventListener('offline', () => { this.online = false; this.toast(this.lang === 'en' ? 'Offline mode' : 'انقطع الاتصال', 'warning'); });
                    this.$watch('currentTab', () => this.$nextTick(() => this.renderCharts()));
                    this.$watch('sales', () => this.saveToStorage()); this.$watch('inventory', () => this.saveToStorage());
                    this.$watch('customers', () => this.saveToStorage()); this.$watch('debts', () => this.saveToStorage());
                    this.$watch('debtPayments', () => this.saveToStorage()); this.$watch('expenses', () => this.saveToStorage());
                    this.$watch('closedShifts', () => this.saveToStorage()); this.$watch('shopInfo', () => this.saveToStorage());
                    this.checkStockAlerts();
                },

                saveToStorage() {
                    try {
                        localStorage.setItem('merchant_data', JSON.stringify({
                            sales: this.sales, inventory: this.inventory, customers: this.customers, debts: this.debts,
                            debtPayments: this.debtPayments, expenses: this.expenses, closedShifts: this.closedShifts,
                            shiftNumber: this.shiftNumber, shiftStartDate: this.shiftStartDate, shopInfo: this.shopInfo
                        }));
                    } catch(e) { console.warn('Storage error', e); }
                },
                loadFromStorage() {
                    try {
                        const d = JSON.parse(localStorage.getItem('merchant_data') || '{}');
                        this.sales = d.sales || []; this.inventory = d.inventory || []; this.customers = d.customers || [];
                        this.debts = d.debts || []; this.debtPayments = d.debtPayments || []; this.expenses = d.expenses || [];
                        this.closedShifts = d.closedShifts || []; this.shiftNumber = d.shiftNumber || 1;
                        this.shiftStartDate = d.shiftStartDate || new Date().toISOString().split('T')[0];
                        this.shopInfo = d.shopInfo || { name: 'التاجر المتنقل', phone: '', address: '', logo: null };
                    } catch(e) { console.warn('Load error', e); }
                },
                exportData() {
                    const blob = new Blob([JSON.stringify({ sales: this.sales, inventory: this.inventory, customers: this.customers, debts: this.debts, debtPayments: this.debtPayments, expenses: this.expenses, closedShifts: this.closedShifts, shiftNumber: this.shiftNumber, shiftStartDate: this.shiftStartDate, shopInfo: this.shopInfo, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `merchant-backup-${new Date().toISOString().split('T')[0]}.json`; a.click();
                    this.toast('تم تصدير النسخة الاحتياطية', 'success');
                },

                seedDemoData() {
                    this.inventory = [
                        { id: 1, name: 'زيت 5L', category: 'بقالة', buyPrice: 800, sellPrice: 1100, stock: 25, maxStock: 50, image: null, barcode: '6001234500011' },
                        { id: 2, name: 'سكر 1Kg', category: 'بقالة', buyPrice: 90, sellPrice: 130, stock: 3, maxStock: 100, image: null, barcode: '6001234500028' },
                        { id: 3, name: 'عصير برتقال', category: 'مشروبات', buyPrice: 80, sellPrice: 120, stock: 48, maxStock: 60, image: null, barcode: '6001234500035' },
                        { id: 4, name: 'شاي أخضر', category: 'مشروبات', buyPrice: 200, sellPrice: 280, stock: 12, maxStock: 40, image: null, barcode: '6001234500042' },
                    ];

                    document.getElementById('receiptPrint').innerHTML = html; window.print();
                },

                // ============ CHARTS ============
                renderCharts() {
                    if (this.currentTab !== 'dashboard') return;
                    this.$nextTick(() => {
                        const days = []; const totals = [];
                        for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const dateStr = d.toISOString().split('T')[0]; days.push(d.toLocaleDateString(this.lang === 'en' ? 'en-US' : 'ar-DZ', { weekday: 'short' })); totals.push(this.sales.filter(s => s.date === dateStr).reduce((sum, s) => sum + this.saleTotal(s), 0)); }
                        const ctx1 = document.getElementById('salesChart');
                        if (ctx1) { if (this.charts.sales) this.charts.sales.destroy(); this.charts.sales = new Chart(ctx1, { type: 'line', data: { labels: days, datasets: [{ label: 'Sales', data: totals, borderColor: '#16a34a', backgroundColor: 'rgba(22, 163, 74, 0.1)', fill: true, tension: 0.4, borderWidth: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
                        const productTotals = {}; this.sales.forEach(s => { (s.items || []).forEach(item => { productTotals[item.itemName] = (productTotals[item.itemName] || 0) + item.quantity; }); });
                        const ctx2 = document.getElementById('productsChart');
                        if (ctx2) { if (this.charts.products) this.charts.products.destroy(); this.charts.products = new Chart(ctx2, { type: 'doughnut', data: { labels: Object.keys(productTotals), datasets: [{ data: Object.values(productTotals), backgroundColor: ['#16a34a', '#22c55e', '#f59e0b', '#3b82f6', '#ef4444', '#8b5cf6', '#ec4899'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false } }); }
                    });
                }
            }
        }
        addSale() {
                    if (this.cart.length === 0) return this.toast(this.lang === 'en' ? 'Cart is empty' : 'السلة فارغة', 'error');
                    if (!this.saleForm.customerName) return this.toast(this.lang === 'en' ? 'Enter customer name' : 'أدخل اسم الزبون', 'error');
                    const total = this.cartTotal;
                    const sale = { id: Date.now(), customerName: this.saleForm.customerName, items: JSON.parse(JSON.stringify(this.cart)), status: this.saleForm.paymentMethod === 'cash' ? 'paid' : (this.saleForm.paymentMethod === 'partial' ? 'pending' : 'debt'), paymentMethod: this.saleForm.paymentMethod, date: new Date().toISOString().split('T')[0], deliveryMethod: 'تسليم مباشر' };
                    this.sales.unshift(sale);
                    this.cart.forEach(c => { const p = this.inventory.find(i => i.id === c.inventoryId); if (p) p.stock -= c.quantity; });
                    if (this.saleForm.paymentMethod !== 'cash') {
                        const paid = this.saleForm.paymentMethod === 'partial' ? (this.saleForm.paidAmount || 0) : 0;
                        this.debts.unshift({ id: Date.now(), customerName: this.saleForm.customerName, totalAmount: total, paidAmount: paid, status: paid >= total ? 'paid' : (paid > 0 ? 'partial' : 'unpaid'), date: sale.date, saleId: sale.id });
                    }
                    if (!this.customers.find(c => c.name === this.saleForm.customerName)) this.customers.push({ id: Date.now(), name: this.saleForm.customerName, phone: '', address: '', notes: '', lat: null, lng: null });
                    this.closeModal('sale'); this.toast(this.lang === 'en' ? 'Invoice saved' : 'تم حفظ الفاتورة بنجاح', 'success');
                    this.pushNotification('sale', 'فاتورة جديدة', `${sale.customerName} - ${total.toLocaleString()} ${this.currency}`);
                    this.checkStockAlerts();
                },

                openEditSale(sale) { this.editSaleForm = { id: sale.id, customerName: sale.customerName, items: JSON.parse(JSON.stringify(sale.items)) }; this.modals.editSale = true; },
                saveEditSale() {
                    const original = this.sales.find(s => s.id === this.editSaleForm.id); if (!original) return;
                    if (this.editSaleForm.items.length === 0) return this.toast('الفاتورة فارغة', 'error');
                    original.items.forEach(oldItem => { const p = this.inventory.find(i => i.id === oldItem.inventoryId); if (p) p.stock += oldItem.quantity; });
                    for (const newItem of this.editSaleForm.items) {
                        const p = this.inventory.find(i => i.id === newItem.inventoryId);
                        if (!p) { original.items.forEach(oi => { const pp = this.inventory.find(i => i.id === oi.inventoryId); if (pp) pp.stock -= oi.quantity; }); return this.toast('منتج غير موجود', 'error'); }
                        if (p.stock < newItem.quantity) { this.editSaleForm.items.forEach(ni => { const pp = this.inventory.find(i => i.id === ni.inventoryId); if (pp) pp.stock += ni.quantity; }); original.items.forEach(oi => { const pp = this.inventory.find(i => i.id === oi.inventoryId); if (pp) pp.stock -= oi.quantity; }); return this.toast(`كمية ${p.name} غير متوفرة`, 'error'); }
                        p.stock -= newItem.quantity;
                    }
                    original.customerName = this.editSaleForm.customerName; original.items = JSON.parse(JSON.stringify(this.editSaleForm.items));
                    const linkedDebt = this.debts.find(d => d.saleId === original.id);
                    if (linkedDebt) { const newTotal = this.saleTotal(original); linkedDebt.totalAmount = newTotal; linkedDebt.paidAmount = Math.min(linkedDebt.paidAmount, newTotal); linkedDebt.status = linkedDebt.paidAmount >= newTotal ? 'paid' : (linkedDebt.paidAmount > 0 ? 'partial' : 'unpaid'); }
                    this.closeModal('editSale'); this.toast(this.lang === 'en' ? 'Invoice updated' : 'تم التحديث', 'success');
                },

                openPriceModal(sale) { this.priceEditSale = JSON.parse(JSON.stringify(sale)); this.modals.priceEdit = true; },
                updateSaleItemPrice(idx, newPrice) { this.priceEditSale.items[idx].itemPrice = Number(newPrice) || 0; },
                savePriceEdit() {
                    const original = this.sales.find(s => s.id === this.priceEditSale.id); if (!original) return;
                    original.items = JSON.parse(JSON.stringify(this.priceEditSale.items));
                    const linkedDebt = this.debts.find(d => d.saleId === original.id);
                    if (linkedDebt) { const newTotal = this.saleTotal(original); linkedDebt.totalAmount = newTotal; linkedDebt.paidAmount = Math.min(linkedDebt.paidAmount, newTotal); linkedDebt.status = linkedDebt.paidAmount >= newTotal ? 'paid' : (linkedDebt.paidAmount > 0 ? 'partial' : 'unpaid'); }
                    this.closeModal('priceEdit'); this.toast('تم تحديث الأسعار', 'success');
                },

                deleteSale(sale) {
                    this.confirmMsg = (this.lang === 'en' ? 'Delete invoice for ' : 'حذف فاتورة ') + sale.customerName + '?';
                    this.pendingConfirm = () => {
                        sale.items.forEach(item => { const p = this.inventory.find(i => i.id === item.inventoryId); if (p) p.stock += item.quantity; });
                        const linkedDebtIndex = this.debts.findIndex(d => d.saleId === sale.id); if (linkedDebtIndex !== -1) this.debts.splice(linkedDebtIndex, 1);

                },

                printReceipt(sale) {
                    const total = this.saleTotal(sale);
                    const itemsRows = (sale.items || []).map(i => `<tr><td style="padding:4px 0;">${i.itemName}</td><td style="text-align:center;">${i.quantity}</td><td style="text-align:left;">${i.itemPrice} ${this.currency}</td><td style="text-align:left;font-weight:bold;">${(i.itemPrice*i.quantity).toLocaleString()} ${this.currency}</td></tr>`).join('');

                    document.getElementById('receiptPrint').innerHTML = html; window.print();
                },
                async exportPDF(sale) {
                    try {
                        const total = this.saleTotal(sale);

                        tempDiv.style.cssText = 'position:fixed;left:-9999px;top:0;width:400px;font-family:Cairo,sans-serif;direction:rtl;padding:20px;background:white;color:black;';
                        tempDiv.innerHTML = `<div style="text-align:center;margin-bottom:20px;"><h2 style="margin:0;color:#16a34a;">${this.shopInfo.name}</h2></div><table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:15px;"><thead><tr style="background:#f0fdf4;border-bottom:2px solid #16a34a;"><th style="text-align:right;padding:8px;">المنتج</th><th style="text-align:center;padding:8px;">كمية</th><th style="text-align:left;padding:8px;">سعر</th><th style="text-align:left;padding:8px;">إجمالي</th></tr></thead><tbody>${itemsRows}</tbody></table><div style="background:#16a34a;color:white;padding:12px;border-radius:8px;text-align:center;"><p style="margin:0;font-size:14px;">الإجمالي</p><p style="margin:4px 0 0;font-size:20px;font-weight:bold;">${total.toLocaleString()} ${this.currency}</p></div>`;
                        document.body.appendChild(tempDiv);
                        const canvas = await html2canvas(tempDiv, { scale: 2, backgroundColor: '#ffffff' });
                        document.body.removeChild(tempDiv);
                        const { jsPDF } = window.jspdf; const pdf = new jsPDF('p', 'mm', 'a4');
                        const imgData = canvas.toDataURL('image/png'); const pdfWidth = pdf.internal.pageSize.getWidth();
                        pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, (canvas.height * pdfWidth) / canvas.width);
                        pdf.save(`invoice-${sale.id}.pdf`); this.toast('PDF exported', 'success');

                },
                sendWhatsApp(sale) {

                    window.open(`https://wa.me/?text=${encodeURIComponent(`🧾 فاتورة\nالزبون: ${sale.customerName}\n\n${itemsText}\nالإجمالي: ${total.toLocaleString()} ${this.currency}`)}`, '_blank');
                },

                addInventory() { this.inventory.push({ ...this.invForm, id: Date.now(), maxStock: Math.max(this.invForm.stock * 2, 10) }); this.closeModal('inventory'); this.toast('تمت الإضافة', 'success'); this.checkStockAlerts(); },
                openEditInventory(item) { this.editInvForm = JSON.parse(JSON.stringify(item)); this.modals.editInventory = true; },
                saveEditInventory() { const idx = this.inventory.findIndex(i => i.id === this.editInvForm.id); if (idx !== -1) { this.inventory[idx] = { ...this.editInvForm }; this.closeModal('editInventory'); this.toast('تم التحديث', 'success'); } },

                deleteInventory(id) { this.confirmMsg = 'حذف المنتج؟'; this.pendingConfirm = () => { this.inventory = this.inventory.filter(i => i.id !== id); this.toast('تم الحذف', 'success'); }; this.modals.confirm = true; },
                handleImageUpload(event, target) {
                    const file = event.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas'); let width = img.width; let height = img.height; const MAX = 600;
                            if (width > MAX) { height = Math.round((height * MAX) / width); width = MAX; }
                            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                            const base64 = canvas.toDataURL('image/jpeg', 0.7);
                            if (target === 'inventory') this.invForm.image = base64; else if (target === 'editInventory') this.editInvForm.image = base64; else if (target === 'settings') this.shopInfo.logo = base64;
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                addCustomer() { this.customers.push({ ...this.custForm, id: Date.now() }); this.closeModal('customer'); this.toast('تمت الإضافة', 'success'); },
                deleteCustomer(id) { this.confirmMsg = 'حذف الزبون؟'; this.pendingConfirm = () => { this.customers = this.customers.filter(c => c.id !== id); this.toast('تم الحذف', 'success'); }; this.modals.confirm = true; },
                callCustomer(phone) { window.location.href = `tel:${phone}`; },
                viewCustomerHistory(c) {
                    this.historyCustomerName = c.name;
                    const salesH = this.sales.filter(s => s.customerName === c.name).map(s => ({ id: s.id, itemName: '🧾 ' + this.saleItemsSummary(s), date: s.date, amount: this.saleTotal(s) }));
                    const pays = this.debtPayments.filter(p => { const d = this.debts.find(dd => dd.id === p.debtId); return d && d.customerName === c.name; }).map(p => ({ id: 'p'+p.id, itemName: '💵 دفعة', amount: p.amount, date: p.date }));
                    this.historyItems = [...salesH, ...pays].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                    this.modals.history = true;
                },

                openPaymentModal(d) { this.selectedDebt = d; this.paymentAmount = d.totalAmount - d.paidAmount; this.modals.payment = true; },
                addPayment() {
                    if (!this.selectedDebt || !this.paymentAmount) return;

                },
                deleteExpense(exp) { this.confirmMsg = 'حذف المصروف؟'; this.pendingConfirm = () => { this.expenses = this.expenses.filter(e => e.id !== exp.id); this.toast('تم الحذف', 'success'); }; this.modals.confirm = true; },

                openClotureConfirm() {
                    if (this.sales.length === 0 && this.expenses.length === 0) return this.toast('لا توجد بيانات', 'warning');
                    this.confirmMsg = `إغلاق الجولة #${this.shiftNumber}؟`; this.pendingConfirm = () => this.closeShift(); this.modals.confirm = true;

                closeShift() {

                toggleShiftDetails(id) { this.expandedShift = this.expandedShift === id ? null : id; },
                confirmAction() { if (this.pendingConfirm) this.pendingConfirm(); this.modals.confirm = false; this.pendingConfirm = null; },

                changeCurrency(newCurrency) { this.currency = newCurrency; localStorage.setItem('currency', newCurrency); this.toast('تم تغيير العملة', 'success'); },
                cycleCurrency() {
                    const currencies = ['د.ج', '€', '$', 'د.م', 'ر.س', 'د.إ', 'ج.م', 'د.ت'];
                    let currentIndex = currencies.indexOf(this.currency); if (currentIndex === -1) currentIndex = 0;

                },
                toggleLanguage() {

                    this.toast(this.lang === 'en' ? 'Language: English' : 'اللغة: العربية', 'success');
                },

                openBarcodeScanner(target) { this.barcodeTarget = target; this.barcodeManualInput = ''; this.cameraError = ''; this.cameraLoading = true; this.modals.barcode = true; this.$nextTick(() => setTimeout(() => this.startCameraScan(), 400)); },
                closeBarcodeScanner() { this.stopCameraScan(); this.modals.barcode = false; this.barcodeTarget = null; },
                async startCameraScan() {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.cameraLoading = false; this.cameraError = 'المتصفح لا يدعم الكاميرا'; return; }
                        if (typeof Html5Qrcode === 'undefined') { this.cameraLoading = false; this.cameraError = 'مكتبة المسح لم تُحمل'; return; }
                        await this.stopCameraScan();
                        this.barcodeScanner = new Html5Qrcode("barcodeReader");
                        await this.barcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } },
                            (decodedText) => { if(navigator.vibrate) navigator.vibrate(100); this.applyBarcode(decodedText); }, () => {});
                        this.cameraLoading = false;
                    } catch (err) { this.cameraLoading = false; this.cameraError = 'فشل فتح الكاميرا. استخدم الإدخال اليدوي.'; }
                },
                async stopCameraScan() { if (this.barcodeScanner) { try { await this.barcodeScanner.stop(); this.barcodeScanner.clear(); } catch(e) {} this.barcodeScanner = null; } },
                applyBarcode(code) {
                    if (!code || !code.trim()) return; const trimmed = code.trim();

                        const p = this.inventory.find(i => i.barcode === trimmed);

                    else if (this.barcodeTarget === 'editInventory') { this.editInvForm.barcode = trimmed; this.closeBarcodeScanner(); }

                checkStockAlerts() { this.inventory.filter(i => i.stock < 5).forEach(i => { if (!this.notifications.find(n => n.type === 'stock' && n.message.includes(i.name))) this.pushNotification('stock', 'نقص مخزون', `${i.name} - المتبقي ${i.stock} فقط`); }); },

                renderCharts() {
                    if (this.currentTab !== 'dashboard') return;
                    this.$nextTick(() => {
                        const days = []; const totals = [];
                        for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const dateStr = d.toISOString().split('T')[0]; days.push(d.toLocaleDateString(this.lang === 'en' ? 'en-US' : 'ar-DZ', { weekday: 'short' })); totals.push(this.sales.filter(s => s.date === dateStr).reduce((sum, s) => sum + this.saleTotal(s), 0)); }
                        const ctx1 = document.getElementById('salesChart');
                        if (ctx1) { if (this.charts.sales) this.charts.sales.destroy(); this.charts.sales = new Chart(ctx1, { type: 'line', data: { labels: days, datasets: [{ label: 'Sales', data: totals, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', fill: true, tension: 0.4, borderWidth: 3, pointBackgroundColor: '#16a34a' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { font: { family: 'Cairo' } } }, x: { ticks: { font: { family: 'Cairo' } } } } } }); }
                        const productTotals = {};
                        this.sales.forEach(s => { (s.items || []).forEach(item => { productTotals[item.itemName] = (productTotals[item.itemName] || 0) + item.quantity; }); });
                        const ctx2 = document.getElementById('productsChart');
                        if (ctx2) { if (this.charts.products) this.charts.products.destroy(); this.charts.products = new Chart(ctx2, { type: 'doughnut', data: { labels: Object.keys(productTotals), datasets: [{ data: Object.values(productTotals), backgroundColor: ['#16a34a', '#22c55e', '#f59e0b', '#3b82f6', '#ef4444', '#8b5cf6', '#ec4899'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Cairo' }, padding: 10 } } } } }); }
                    });
                }
            }
        }
